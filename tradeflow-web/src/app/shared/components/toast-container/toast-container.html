<div class="toast-stack" aria-live="polite">
    @for (toast of toastService.toasts(); track toast.id) {
    <div class="app-toast" [class]="'app-toast-' + toast.type" role="status">
        <i class="fa-solid" [class]="icons[toast.type]"></i>
        <span class="flex-grow-1">{{ toast.message }}</span>
        <button type="button" class="btn-close btn-sm" aria-label="Close" (click)="toastService.dismiss(toast.id)"></button>
    </div>
    }
</div>
